<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="global.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="global.css" />
  </head>
  <style>
    @media (max-width: 360px) {
      .profile-top {
        flex-direction: column;
        align-items: start;
      }
      aside.profile .content {
        flex-direction: column;
        align-items: start;
      }
    }

    @media (max-width: 768px) {
      li .subtitle {
        opacity: 0;
      }
      li:hover .subtitle {
        opacity: 0.8;
      }
      li:hover {
        background-color: var(--clr-hvr);
      }
    }
  </style>
  <body class="h-[10000px] bg-[var(--clr-light)] px-[8%] py-6">
    <aside class="max-w-[353px] profile">
      <div class="profile-top flex items-center gap-3 md:mb-4">
        <div
          class="left w-[100px] h-[100px] rounded-md overflow-hidden shadow-[0_3px_8px_rgba(0,0,0,0.24)]"
        >
          <img
            class="w-full"
            src="./asset/image/avatar.png"
            alt="avatar-profile"
          />
        </div>
        <div class="right max-w-[240px] text-[var(--clr-dark)]">
          <h2 class="text-xl flex items-center gap-1">
            <span class="leading-snug whitespace-nowrap">Eko Ramadani</span>
            <div
              class="icon-vertify bg-no-repeat bg-[url(./asset/icon/logo/vertify.svg)] w-[22px] h-[22px]"
            ></div>
          </h2>
          <span class="text-sm text-[var(--clr-sub-text)]">Student</span>
          <p class="text-base">
            Culpa velit fugia via quis aliquatemporm quam digniss.
          </p>
          <div class="status flex items-center gap-1">
            <div
              class="icon-status relative w-2 h-2 bg-green-600 rounded-2xl after:content-[''] after:w-[125%] after:h-[125%] after:bg-green-600 after:absolute after:top-1/2 after:left-1/2 after:-translate-1/2 after:rounded-full after:animate-ping"
            ></div>
            <span class="text-sm text-green-900">Online</span>
          </div>
        </div>
      </div>
      <div class="profile-bottom">
        <h2
          class="text-base font-medium md:flex items-center gap-1 hidden mb-3"
        >
          <div
            class="icon-social w-[24px] h-[24px] bg-no-repeat bg-[url(./asset/icon/btn/share.svg)]"
          ></div>
          <span>Social Media</span>
        </h2>
        <div
          class="content flex items-end gap-2 justify-between md:flex-col md:items-start"
        >
          <div
            class="social-content min-w-[168px] overflow-x-auto pt-7 p-1 pb-3.5 md:pt-2"
          >
            <ul
              class="*:w-[30px] *:h-[30px] *:flex *:justify-center *:items-center *:bg-[var(--clr-secondary)] *:shadow-[0_3px_8px_rgba(0,0,0,0.24)] *:rounded-sm flex gap-3 md:flex-col md:gap-4 w-max"
            >
              <li class="after:content relative">
                <a href="#">
                  <div class="item-social">
                    <img src="./asset/icon/logo/instagram.svg" alt="" />
                  </div>
                  <span
                    class="subtitle transition-opacity duration-300 md:block absolute left-1/2 -translate-x-1/2 text-sm bg-black text-white p-1 rounded-sm bottom-[105%] md:top-1/2 md:-translate-y-1/2 md:left-[130%] md:bg-transparent md:text-black md:-bottom-1/2 md:-translate-x-0"
                    >@eko.rama</span
                  >
                </a>
              </li>
              <li class="after:content relative">
                <a href="#">
                  <div class="item-social">
                    <img src="./asset/icon/logo/github.svg" alt="" />
                  </div>
                  <span
                    class="subtitle transition-opacity duration-300 md:block absolute left-1/2 -translate-x-1/2 text-sm bg-black text-white p-1 rounded-sm bottom-[105%] md:top-1/2 md:-translate-y-1/2 md:left-[130%] md:bg-transparent md:text-black md:-bottom-1/2 md:-translate-x-0"
                    >Ramadn</span
                  >
                </a>
              </li>
              <li class="after:content relative">
                <a href="#">
                  <div class="item-social">
                    <img src="./asset/icon/logo/facebook.svg" alt="" />
                  </div>
                  <span
                    class="subtitle transition-opacity duration-300 md:block absolute left-1/2 -translate-x-1/2 text-sm bg-black text-white p-1 rounded-sm bottom-[105%] md:top-1/2 md:-translate-y-1/2 md:left-[130%] md:bg-transparent md:text-black md:-bottom-1/2 md:-translate-x-0"
                    >EkoRamadani</span
                  >
                </a>
              </li>
              <li class="after:content relative">
                <a href="#">
                  <div class="item-social">
                    <img src="./asset/icon/logo/x.svg" alt="" />
                  </div>
                  <span
                    class="subtitle transition-opacity duration-300 md:block absolute left-1/2 -translate-x-1/2 text-sm bg-black text-white p-1 rounded-sm bottom-[105%] md:top-1/2 md:-translate-y-1/2 md:left-[130%] md:bg-transparent md:text-black md:-bottom-1/2 md:-translate-x-0"
                    >ekorama</span
                  >
                </a>
              </li>
              <li><a href="#"></a></li>
            </ul>
          </div>
          <button
            class="px-5 py-4 rounded-md bg-[var(--clr-secondary2)] text-white cursor-pointer hover:bg-[var(--clr-secondary2-hvr)] duration-200 leading-snug whitespace-nowrap"
          >
            See Full About Me
          </button>
        </div>
      </div>
    </aside>
  </body>
</html>
