<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="global.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="h-[10000px] bg-[var(--clr-light)] px-[5%] py-6">
    <section class="project text-[var(--clr-dark)]">
      <h2 class="flex items-center gap-1 mb-4">
        <div
          class="icon-stack bg-no-repeat bg-[url(./asset/icon/btn/project.svg)] w-[24px] h-[24px]"
        ></div>
        <span class="">Project</span>
      </h2>
      <div class="projectlist-content px-4 flex flex-col gap-5">
        <div
          class="box min-w-[331px] max-w-[400px] p-3 shd2 rounded-2xl ring-1 ring-black hover:bg-[var(--clr-hvr)] duration-150 hover:scale-105"
        >
          <div class="thumbnail">
            <img
              class="w-full min-w-[302px]"
              src="./asset/image/thum.png"
              alt=""
            />
          </div>
          <div class="describ">
            <h3 class="title-project text-base">Menejement App Berbasis Web</h3>
            <div class="detail flex w-full justify-between items-center">
              <div class="tech flex gap-2 items-center">
                <div class="icon">
                  <img
                    src="./asset/icon/logo/chrome.svg"
                    class="min-w-[18px] min-h-[18px]"
                    alt="chrome-logo"
                  />
                </div>
                <span class="text-sm">Website</span>
              </div>
              <div class="avartar-list">
                <img
                  class="w-[31px] h-[31px] rounded-full object-top-left object-fill"
                  src="./asset/image/avatar2.png"
                  alt=""
                />
              </div>
            </div>
          </div>
        </div>
        <div
          class="box min-w-[331px] max-w-[400px] p-3 shd2 rounded-2xl ring-1 ring-black hover:bg-[var(--clr-hvr)] duration-150 hover:scale-105"
        >
          <div class="thumbnail">
            <img
              class="w-full min-w-[302px]"
              src="./asset/image/thum.png"
              alt=""
            />
          </div>
          <div class="describ">
            <h3 class="title-project text-base">Menejement App Berbasis Web</h3>
            <div class="detail flex w-full justify-between items-center">
              <div class="tech flex gap-2 items-center">
                <div class="icon">
                  <img
                    src="./asset/icon/logo/chrome.svg"
                    class="min-w-[18px] min-h-[18px]"
                    alt="chrome-logo"
                  />
                </div>
                <span class="text-sm">Website</span>
              </div>
              <div class="avartar-list">
                <img
                  class="w-[31px] h-[31px] rounded-full object-top-left object-fill"
                  src="./asset/image/avatar2.png"
                  alt=""
                />
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
