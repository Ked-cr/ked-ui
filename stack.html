    <style>
      .container-item-stack {
        animation: scroll-horizontal 20s linear infinite;
      }
      .container-item-stack:nth-of-type(2) {
        transform: translate(100%);
        animation-delay: 10s;
      }

      .container-item-stack2 {
        animation: scroll-horizontal2 20s linear infinite;
      }
      .container-item-stack2:nth-of-type(2) {
        transform: translate(-100%);
        animation-delay: 10s;
      }

      @keyframes scroll-horizontal {
        0% {
          transform: translateX(100%);
        }
        100% {
          transform: translateX(-100%);
        }
      }
      @keyframes scroll-horizontal2 {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      .content::before,
      .content::after {
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 1) 37%,
          rgba(255, 255, 255, 0) 100%
        );
        content: "";
        height: 100%;
        position: absolute;
        width: 15%;
        z-index: 2;
      }
      .content::after {
        right: -5px;
        top: 0;
        transform: rotateZ(180deg);
      }
      .content::before {
        left: 0;
        top: 0;
      }
    </style>
