<!DOCTYPE html>
<html lang="en">
  <head>
    <title></title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>contact</title>
    <link rel="stylesheet" href="global.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="h-[10000px] bg-[var(--clr-light)] px-[5%] py-6">
    <section class="contact">
      <h2 class="flex items-center gap-1 mb-4">
        <div
          class="icon-stack bg-no-repeat bg-[url(./asset/icon/btn/contact.svg)] w-[24px] h-[24px]"
        ></div>
        <span class="text-[var(--clr-dark)]">Article</span>
      </h2>
      <div class="top-contact text-white flex flex-wrap gap-2.5 mb-3">
        <button
          class="p-4 px-5 rounded-md cursor-pointer bg-[var(--clr-primary)] hover:bg-[var(--clr-primary-hvr)] duration-150 shd2 flex gap-2 items-center"
        >
          <div
            class="icon-mail bg-no-repeat w-[22px] h-[22px] bg-center bg-[url(./asset/icon/btn/email-light.svg)]"
          ></div>
          <span class="text-base whitespace-nowrap">Send Email Me</span>
        </button>
        <button
          class="p-4 px-5 rounded-md cursor-pointer bg-[#9B006C] hover:bg-[#BE0085] duration-150 shd2 flex gap-2 items-center"
        >
          <div
            class="icon-mail bg-no-repeat w-[22px] h-[22px] bg-center bg-[url(./asset/icon/btn/dm-me.svg)]"
          ></div>
          <span class="text-base whitespace-nowrap">DM Me</span>
        </button>
        <button
          class="p-4 px-5 rounded-md cursor-pointer bg-[#007129] hover:bg-[#00AB3F] duration-150 shd2 flex gap-2"
        >
          <div
            class="icon-mail bg-no-repeat w-[22px] h-[22px] bg-center bg-[url(./asset/icon/btn/send-message-me.svg)]"
          ></div>
          <span class="text-base whitespace-nowrap">Send Message Me</span>
        </button>
      </div>
      <span class="text-[var(--clr-sub-text-dark)] block mb-3 text-base"
        >-Or-</span
      >
      <form action="" class="bg-[#EBEBEB] p-4 pt-6 rounded-xl max-w-[400px] min-w-[354px]">
        <div class="input-grub flex flex-col gap-2 mb-3">
          <label for="subject">Subject</label>
          <input
            type="text"
            required
            name="subject"
            id="subject"
            class="w-full h-[42px] bg-white rounded-md text-[var(--clr-dark)] px-4"
          />
        </div>
        <div class="input-grub flex flex-col gap-2 mb-3">
          <label for="email" class="text-base text-[var(--clr-dark)]"
            >Email</label
          >
          <input
            type="email"
            name="email"
            required
            id="email"
            class="w-full h-[42px] bg-white rounded-md text-[var(--clr-dark)] px-4"
          />
        </div>
        <div class="input-grub flex flex-col gap-2 mb-5">
          <label for="message" class="text-base text-[var(--clr-dark)]"
            >Message</label
          >
          <textarea
            name="message"
            class="w-full h-[132px] pt-2 bg-white rounded-md text-[var(--clr-dark)] px-4"
            id=""
          ></textarea>
        </div>

        <button
          class="p-4 px-5 text-white rounded-md cursor-pointer bg-[#0074C7] hover:bg-[#0090F8] duration-150 shd2 flex gap-2"
        >
          <div
            class="icon-mail bg-no-repeat w-[22px] h-[22px] bg-center bg-[url(./asset/icon/btn/plane-send.svg)]"
          ></div>

          <span class="text-base whitespace-nowrap">Submit</span>
        </button>
      </form>
    </section>
  </body>
</html>
